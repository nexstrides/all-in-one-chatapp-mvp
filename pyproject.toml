[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "all-in-one-chatapp"
version = "0.1.1"
description = "Local Windows desktop workspace for isolated messaging accounts"
requires-python = ">=3.12"
dependencies = [
  "PySide6==6.12.0",
  "Windows-Toasts==1.3.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1", "mypy>=1.15,<3", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
allinone = "allinone.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
allinone = ["recipes/*.json", "theme.qss"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["allinone"]
omit = ["*/app.py", "*/main_window.py", "*/service_view.py", "*/notifications.py", "*/dialogs.py", "*/__main__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true

