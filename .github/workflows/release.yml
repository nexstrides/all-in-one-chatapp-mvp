name: Windows release candidate
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      RUN_WEBENGINE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m pytest --cov
      - run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name AllInOneChatapp --collect-data allinone --collect-all windows_toasts packaging/entrypoint.py
      - name: Build per-user installer
        shell: pwsh
        run: |
          $version = python -c "from allinone import __version__; print(__version__)"
          if ("v$version" -ne "$env:GITHUB_REF_NAME") { throw "Tag and app version differ" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          Compress-Archive -Path dist/AllInOneChatapp -DestinationPath dist/AllInOneChatapp-Windows-x64.zip
          Get-ChildItem dist/*.zip,dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }
      - name: Create draft release for manual Windows smoke testing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" dist/AllInOneChatapp-Windows-x64.zip dist/AllInOneChatapp-Setup.exe dist/SHA256SUMS.txt --draft --title "All in One Chatapp $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md
